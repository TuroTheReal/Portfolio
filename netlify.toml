[build]
  publish = "/"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Redirections 301, migration domaine (arthur-portfolio.com → arthurbernard.dev)
# Note : Netlify auto-upgrade HTTP → HTTPS avant d'évaluer ces règles, donc seules
# les règles HTTPS sont effectives. La chaîne HTTP→HTTPS→nouveau-domaine reste OK
# pour le SEO (Google suit les redirects, max 2 hops).
[[redirects]]
  from = "https://arthur-portfolio.com/*"
  to = "https://arthurbernard.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.arthur-portfolio.com/*"
  to = "https://arthurbernard.dev/:splat"
  status = 301
  force = true

# Redirections 301, migration i18n (ancien suffix → folder-based)
[[redirects]]
  from = "/index_en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/index_en.html"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/index_fr"
  to = "/fr/"
  status = 301

[[redirects]]
  from = "/index_fr.html"
  to = "/fr/"
  status = 301

[[redirects]]
  from = "/resume_en"
  to = "/en/resume"
  status = 301

[[redirects]]
  from = "/resume_en.html"
  to = "/en/resume"
  status = 301

[[redirects]]
  from = "/resume_fr"
  to = "/fr/resume"
  status = 301

[[redirects]]
  from = "/resume_fr.html"
  to = "/fr/resume"
  status = 301

# Le logo de signature a brievement ete publie sans son suffixe -2x. L URL est
# inscrite en dur dans les mails deja envoyes : elle doit continuer de repondre.
# A retirer le jour ou un vrai fichier 1x prendra ce nom.
[[redirects]]
  from = "/assets/img/logo-mail.png"
  to = "/assets/img/logo-mail-2x.png"
  status = 301

# Les polices ne changent jamais : un an de cache, et immuable pour que le
# navigateur ne revalide meme pas. Corollaire a retenir : le nom de fichier ne
# portant pas d empreinte, REMPLACER une police impose de la RENOMMER, sinon les
# visiteurs garderont l ancienne version pendant un an.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité (defense-in-depth). HSTS déjà ajouté par Netlify.
# CSP volontairement omise pour l'instant (site statique, scripts inline + GA
# à hasher : sur-investissement vs le gain réel).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"