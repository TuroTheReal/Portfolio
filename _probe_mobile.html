<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<iframe id="f" src="/_shot_en.html" style="width:320px;height:900px;border:0;display:block;margin:0 auto"></iframe>
<pre id="PROBE" style="color:#0f0;font:12px monospace;white-space:pre-wrap"></pre>
<script>
var W=[320,390,560,820,1024,1200], out=[], i=0;
function step(){
  if(i>=W.length){document.getElementById('PROBE').textContent=out.join('\n');return;}
  var f=document.getElementById('f'); f.style.width=W[i]+'px';
  setTimeout(function(){
    var d=f.contentDocument, vw=d.documentElement.clientWidth, bad=[];
    d.querySelectorAll('*').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.width>0 && r.right>vw+1 && !el.closest('.overlay') && !el.classList.contains('blob') && !el.closest('.hero-mesh'))
        bad.push('  '+el.tagName+'.'+(typeof el.className==='string'?el.className:''));
    });
    out.push('['+W[i]+'] '+d.documentElement.scrollWidth+(bad.length?'\n'+bad.slice(0,3).join('\n'):'  OK'));
    i++; step();
  },300);
}
window.addEventListener('load',function(){setTimeout(step,400);});
</script>
