<!DOCTYPE html>
<html lang="fr">
<head>

	<!-- Google tag (gtag.js) -->

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
	<meta name="theme-color" content="#121212">
	<meta name="description" content="Page introuvable (404) — Arthur Bernard.">
	<meta name="robots" content="noindex, follow">

	<title>404 · Page introuvable | Arthur Bernard</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Poppins:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
	<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Poppins:wght@400;500;600&display=swap"></noscript>
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='50%25' y='75%25' text-anchor='middle' font-family='Poppins,sans-serif' font-weight='600' font-size='24' fill='%238c96ff'%3EA.%3C/text%3E%3C/svg%3E">

	<style>
		/* ===== 404 — réponse HTTP (mobile-first), tokens du site ===== */
		.err404 {
			--e4-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
			--e4-danger: #f97583;
			min-height: calc(100svh - var(--header-height));
			display: grid;
			place-items: center;
			padding: 2rem 1.25rem 3.5rem;
		}
		body.light-theme .err404 { --e4-danger: #dc2626; }

		.err404__card {
			width: 100%;
			max-width: 30rem;
			font-family: var(--e4-mono);
		}

		/* ligne de requête : GET /path 404 */
		.err404__req {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: .5rem;
			font-size: .8rem;
			color: var(--text-secondary);
			margin-bottom: 1.25rem;
			min-width: 0;
		}
		.err404__verb { color: var(--accent); font-weight: 600; }
		.err404__path {
			color: var(--text-primary);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			max-width: 100%;
		}
		.err404__pill {
			font-size: .68rem;
			color: var(--e4-danger);
			border: 1px solid var(--e4-danger);
			border-radius: 5px;
			padding: .1rem .4rem;
			white-space: nowrap;
		}

		/* statut : 404 Not Found */
		.err404__status {
			display: flex;
			align-items: baseline;
			flex-wrap: wrap;
			gap: .3rem .9rem;
			margin-bottom: 1.4rem;
		}
		.err404__code {
			font-family: var(--font-title);
			font-weight: 600;
			font-size: clamp(3.5rem, 20vw, 5rem);
			line-height: 1;
			letter-spacing: -.03em;
			color: var(--e4-danger);
		}
		.err404__reason {
			font-family: var(--font-title);
			font-weight: 500;
			font-size: clamp(1.1rem, 5vw, 1.35rem);
			color: var(--text-primary);
		}

		/* pseudo-headers : clé / valeur */
		.err404__hdr {
			border-left: 2px solid var(--header-border);
			padding-left: .9rem;
			display: grid;
			gap: .45rem;
			margin: 0 0 1.9rem;
			font-size: .82rem;
			line-height: 1.5;
		}
		.err404__row { display: flex; gap: .5rem; }
		.err404__key { color: var(--text-secondary); }
		.err404__key::after { content: ":"; }
		.err404__val { color: var(--text-primary); }

		/* CTA */
		.err404__cta { display: flex; flex-wrap: wrap; gap: .7rem; }
		.err404__btn {
			font-family: var(--font-text);
			font-size: .9rem;
			font-weight: 500;
			text-decoration: none;
			border-radius: 9px;
			padding: .65rem 1.15rem;
			border: 1px solid var(--accent);
			transition: background .15s, color .15s;
		}
		.err404__btn--primary { background: var(--accent); color: #fff; }
		.err404__btn--primary:hover { background: var(--accent-hover); }
		.err404__btn--ghost { background: transparent; color: var(--accent); }
		.err404__btn--ghost:hover { background: var(--accent-muted); }
		.err404__btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

		@media (min-width: 640px) {
			.err404__req { font-size: .85rem; }
			.err404__hdr { font-size: .88rem; }
		}
	</style>

</head>

<body>
	<script>(function(){var s=localStorage.getItem('theme');if(s==='light'||(!s&&window.matchMedia('(prefers-color-scheme: light)').matches))document.body.classList.add('light-theme');})()</script>

	<!-- Header allégé (logo + langue + thème) -->
	<header class="header">
		<a href="/fr/#Home" class="logo" id="e4-logo">A.</a>
		<div class="header-actions">
			<button class="lang-toggle" data-lang="en">EN</button>
			<span class="lang-sep" aria-hidden="true">|</span>
			<button class="lang-toggle active" data-lang="fr">FR</button>
			<label class="switch" aria-label="Changer de thème"><input class="switch__input" type="checkbox" role="switch"><div class="switch__icon"></div><svg class="switch__sun" viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><circle class="sun-core" cx="12" cy="12" r="6.5"/><line x1="12" y1="2" x2="12" y2="3" stroke-width="2.5" stroke-linecap="round"/><line x1="12" y1="21" x2="12" y2="22" stroke-width="2.5" stroke-linecap="round"/><line x1="2" y1="12" x2="3" y2="12" stroke-width="2.5" stroke-linecap="round"/><line x1="21" y1="12" x2="22" y2="12" stroke-width="2.5" stroke-linecap="round"/><line x1="5.05" y1="5.05" x2="5.76" y2="5.76" stroke-width="2.5" stroke-linecap="round"/><line x1="18.24" y1="18.24" x2="18.95" y2="18.95" stroke-width="2.5" stroke-linecap="round"/><line x1="5.05" y1="18.95" x2="5.76" y2="18.24" stroke-width="2.5" stroke-linecap="round"/><line x1="18.24" y1="5.76" x2="18.95" y2="5.05" stroke-width="2.5" stroke-linecap="round"/></svg></label>
		</div>
	</header>

	<main class="err404">
		<div class="err404__card" data-fade>
			<p class="err404__req">
				<span class="err404__verb">GET</span>
				<span class="err404__path" id="e4-path">/page-introuvable</span>
				<span class="err404__pill">404</span>
			</p>

			<div class="err404__status">
				<span class="err404__code">404</span>
				<span class="err404__reason">Not Found</span>
			</div>

			<div class="err404__hdr">
				<div class="err404__row"><span class="err404__key">server</span><span class="err404__val">arthurbernard.dev</span></div>
				<div class="err404__row"><span class="err404__key">message</span><span class="err404__val" data-i18n="message">cette page n'existe pas, ou plus</span></div>
				<div class="err404__row"><span class="err404__key">hint</span><span class="err404__val" data-i18n="hint">reviens à un point connu ↓</span></div>
			</div>

			<div class="err404__cta">
				<a class="err404__btn err404__btn--primary" id="e4-home" href="/fr/" data-i18n="home">Accueil</a>
				<a class="err404__btn err404__btn--ghost" id="e4-blog" href="/fr/blog" data-i18n="blog">Blog</a>
			</div>
		</div>
	</main>

	<!-- i18n + vrai path : FR par défaut, EN si l'URL est /en/... -->
	<script>
		(function () {
			var T = {
				fr: { message: "cette page n'existe pas, ou plus", hint: "reviens à un point connu ↓", home: "Accueil", blog: "Blog", homeHref: "/fr/", blogHref: "/fr/blog" },
				en: { message: "this page doesn't exist, or no longer does", hint: "head back to safe ground ↓", home: "Home", blog: "Blog", homeHref: "/en/", blogHref: "/en/blog" }
			};
			var path = window.location.pathname;
			var lang = path.indexOf('/en') === 0 ? 'en' : 'fr';
			var t = T[lang];

			document.documentElement.lang = lang;
			document.querySelectorAll('[data-i18n]').forEach(function (el) {
				var k = el.getAttribute('data-i18n');
				if (t[k]) el.textContent = t[k];
			});
			document.getElementById('e4-home').setAttribute('href', t.homeHref);
			document.getElementById('e4-blog').setAttribute('href', t.blogHref);
			document.getElementById('e4-logo').setAttribute('href', t.homeHref + '#Home');

			// lang toggle : marquer la langue active
			document.querySelectorAll('.lang-toggle').forEach(function (b) {
				b.classList.toggle('active', b.dataset.lang === lang);
			});

			// afficher le vrai chemin demandé (tronqué si trop long)
			var p = path && path !== '/' ? path : '/page-introuvable';
			if (p.length > 42) p = p.slice(0, 41) + '…';
			document.getElementById('e4-path').textContent = p;
		})();
	</script>

	<script src="/assets/script.js" defer></script>

</body>
</html>
